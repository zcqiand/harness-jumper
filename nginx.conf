# harness-jumper 容器内 nginx 静态服务配置
# Godot WASM 必需跨域隔离头（COOP/COEP）：WASM 多线程/共享 ArrayBuffer 依赖
# crossOriginIsolated 环境（本仓 thread_support=false 也保持隔离头，无副作用且保住扩展余地）。
# 注意 nginx add_header 继承规则：任一 location 出现 add_header 即不再继承上层——
# 所以 COOP/COEP 与 Cache-Control 在每个 location 内同列显式写出，缺一即丢头。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # mime.types 由 nginx 主配置 http 级 include；nginx:alpine 新版自带
    # application/wasm wasm（.wasm 不会落 application/octet-stream）。
    # 不在此写 types 块覆盖——server 级 types 会整体替换继承表，反而丢其他类型。

    # Godot 导出产物文件名固定（index.pck/index.wasm 无内容哈希）——禁长缓存！
    # immutable 一年缓存是 React(Vite 哈希文件名)仓的形状，照抄到 Godot 仓=发版后
    # 浏览器吃一年旧包（2026-11-19 cardbattle 首航豆腐块修复后用户端仍显旧版实锤）。
    # no-cache=每次协商（ETag/Last-Modified 命中 304，代价可忽略），发版即生效。
    location ~* \.(wasm|pck|js|png|worklet\.js)$ {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }
}
